<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Planetarium modified */

#status {
	position: absolute;
	top: 0;
	bottom: 0;
	left: 0;
	right: 0;
	display: flex;
	justify-content: center;
}

#status-splash {
	margin: 100px 0 100px 50px;
}

#info-container {
	width: 300px;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	text-align: left;
	margin: 85px 50px 100px 50px;
	display: flex;
	flex-direction: column;
	justify-content: space-between;
}
		
p {
	color: white;
}

a {
	text-decoration: none;
	color: #adf;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	width: 180px;
	height: 7px;
	background-color: #38363A;
	border: 1px solid #444246;
	padding: 1px;
	box-shadow: 0 0 2px 1px #1B1C22;
	border-radius: 2px;
	visibility: visible;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#graphics-lost {
	position: absolute;
	top: 0;
	bottom: 0;
	left: 0;
	right: 0;
	display: none;
	align-items: center;
	justify-content: center;
	background-color: rgba(0, 0, 0, 0.6);
	z-index: 2;
}

#graphics-lost-notice {
	max-width: 30rem;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	padding: 1rem;
	text-align: center;
}

#graphics-lost-notice button {
	font: inherit;
	margin: 0.25rem;
	padding: 0.25rem 0.75rem;
}

@media only screen and (orientation: portrait) {
	#status {
		flex-direction: column;
		align-items: center;
	}
	#status-splash {
		width: 400px;
		margin: 50px 50px 0 50px;
	}
	#info-container {
		width: 90%;
		flex-direction: column-reverse;
		text-align: center;
		align-items: center;
		margin: 15px 50px 50px 50px;
		justify-content: center;
	}
}

/* END Planetarium */



		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id='graphics-lost'>
			<div id='graphics-lost-notice'>
				<p data-text='graphics_lost'></p>
				<button id='graphics-lost-reload' data-text='reload'></button>
				<button id='graphics-lost-reset' data-text='reload_recommended'></button>
			</div>
		</div>

		<div id='status'>
			<!-- Planetarium:
			Redirected status-splash to pale_blue_dot_453x614.jpg, which web/post_export.py adds to the export.
			Embedded status-progress & status-notice within info-container.
			-->
			<img id='status-splash' src="pale_blue_dot_453x614.jpg" alt="Pale Blue Dot">
			<div id='info-container'>
				<div>
					<p>
						I, Voyager - Planetarium<br>
						v0.2.3.dev1
					</p>
					<p id='language-choices'></p>
					<p data-text='loading'></p>
					<progress id="status-progress"></progress>
					<div id="status-notice"></div>
					<p>
						<br><span data-text='install_web_app'></span><br>
					</p>
					<p>
						<span data-text='windows_app'></span><br>
					</p>
					<p data-text='support_us'></p>
				</div>
				<a id='pbd-caption' href='https://www.planetary.org/worlds/pale-blue-dot' target='_blank'
						data-text='pbd_caption'></a>
			</div>
		</div>

		<script>
// Planetarium: the page's text in each language it offers. An element's text is HTML, a status
// notice's plain text. The page opens in the language a "lang" query parameter names (?lang=de),
// or else in the browser's first language, which the app's Automatic language setting also
// follows; a language not offered here shows as English. Its language links switch it while the
// app downloads. The app's Automatic setting follows a language chosen either way, and nothing
// remembers the choice for the next visit. Runs before the engine script so that the first paint
// is already in the page's language.
const PAGE_TEXTS = {
	'en': {
		'language_name': 'English',
		'loading': 'Loading...',
		'install_web_app': 'You can install the Planetarium as a web app! After download, look for the install icon in the URL bar of your browser.',
		'windows_app': 'A native Windows app can be downloaded <a href="https://www.ivoyager.dev/planetarium/" target="_blank">here</a>.',
		'support_us': 'Please consider supporting us at our GitHub <a href="https://github.com/sponsors/ivoyager" target="_blank">Sponsor\'s Page!</a>',
		'pbd_caption': 'Pale Blue Dot<br><br>Earth as seen by Voyager 1 from 6.4 billion kilometers.',
		'graphics_lost': 'The browser stopped the Planetarium\'s graphics. If this keeps happening, reload with the graphics settings recommended for this device.',
		'reload': 'Reload',
		'reload_recommended': 'Reload with Recommended Settings',
		'missing_features': 'Error\nThe following features required to run Godot projects on the Web are missing:\n',
		'unknown_error': 'An unknown error occurred.',
	},
	'de': {
		'language_name': 'Deutsch',
		'loading': 'Wird geladen...',
		'install_web_app': 'Sie können das Planetarium als Web-App installieren! Suchen Sie nach dem Download das Installationssymbol in der Adressleiste Ihres Browsers.',
		'windows_app': 'Eine native Windows-App können Sie <a href="https://www.ivoyager.dev/planetarium/" target="_blank">hier</a> herunterladen.',
		'support_us': 'Bitte unterstützen Sie uns auf unserer <a href="https://github.com/sponsors/ivoyager" target="_blank">GitHub-Sponsorenseite</a>!',
		'pbd_caption': 'Pale Blue Dot<br><br>Die Erde, von Voyager 1 aus 6,4 Milliarden Kilometern Entfernung gesehen.',
		'graphics_lost': 'Der Browser hat die Grafik des Planetariums angehalten. Passiert das wiederholt, laden Sie mit den für dieses Gerät empfohlenen Grafikeinstellungen neu.',
		'reload': 'Neu laden',
		'reload_recommended': 'Mit empfohlenen Einstellungen neu laden',
		'missing_features': 'Fehler\nFolgende Funktionen, die Godot-Projekte im Web benötigen, fehlen:\n',
		'unknown_error': 'Ein unbekannter Fehler ist aufgetreten.',
	},
};
const PAGE_LANGUAGES = Object.keys(PAGE_TEXTS);
const languageParameter = new URLSearchParams(window.location.search).get('lang');
const pageLocale = languageParameter || navigator.languages?.[0] || navigator.language || 'en';
const localeLanguage = pageLocale.split(/[-_]/)[0].toLowerCase();
// The engine's locale, if not the browser's.
let chosenLanguage = languageParameter ? localeLanguage : '';
let pageTexts = null;

function setPageLanguage(language) {
	pageTexts = PAGE_TEXTS[language];
	document.documentElement.lang = language;
	document.querySelectorAll('[data-text]').forEach((element) => {
		element.innerHTML = pageTexts[element.dataset.text];
	});
	document.getElementById('language-choices').innerHTML = PAGE_LANGUAGES.map((choice) => {
		const name = PAGE_TEXTS[choice]['language_name'];
		if (choice === language) {
			return name;
		}
		return `<a href="?lang=${choice}" lang="${choice}" data-language="${choice}">${name}</a>`;
	}).join(' · ');
}

setPageLanguage(PAGE_LANGUAGES.includes(localeLanguage) ? localeLanguage : 'en');
document.getElementById('language-choices').addEventListener('click', (event) => {
	const link = event.target.closest('[data-language]');
	if (!link) {
		return;
	}
	// A reload would restart the download. The link's address is for opening a new tab.
	event.preventDefault();
	chosenLanguage = link.dataset.language;
	setPageLanguage(chosenLanguage);
});
		</script>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
// Planetarium: Engine.init takes the progress callback from here, and the start-up below can't
// pass it later.
GODOT_CONFIG['onProgress'] = function (current, total) {
	const statusProgress = document.getElementById('status-progress');
	if (current > 0 && total > 0) {
		statusProgress.value = current;
		statusProgress.max = total;
	} else {
		statusProgress.removeAttribute('value');
		statusProgress.removeAttribute('max');
	}
};
const engine = new Engine(GODOT_CONFIG);

// Planetarium: a way back from graphics settings the device can't carry. The hash asks Core to
// restore its recommended graphics settings (IVSettingsManager.RESET_GRAPHICS_ARGUMENT); a lost
// WebGL context, which a reload with the same settings is likely to repeat, offers it.
const RESET_GRAPHICS_HASH = '#reset-graphics';
const isResetGraphics = window.location.hash === RESET_GRAPHICS_HASH;
if (isResetGraphics) {
	// A reload keeps the hash, and only this load should reset.
	window.history.replaceState(null, '', window.location.pathname + window.location.search);
}
document.getElementById('canvas').addEventListener('webglcontextlost', () => {
	document.getElementById('graphics-lost').style.display = 'flex';
});
document.getElementById('graphics-lost-reload').addEventListener('click', () => {
	window.location.reload();
});
document.getElementById('graphics-lost-reset').addEventListener('click', () => {
	window.location.hash = RESET_GRAPHICS_HASH;
	window.location.reload();
});

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice(pageTexts['unknown_error']);
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			displayFailureNotice(pageTexts['missing_features'] + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		// Planetarium: startGame's steps, taken one by one so that the engine starts in a language
		// chosen while it downloaded. The app's Automatic language setting follows its locale.
		const executable = GODOT_CONFIG['executable'];
		const mainPack = GODOT_CONFIG['mainPack'] || `${executable}.pck`;
		const args = GODOT_CONFIG['args'] || [];
		Promise.all([
			engine.init(executable),
			engine.preloadFile(mainPack, mainPack),
		]).then(() => {
			const override = {
				'args': ['--main-pack', mainPack].concat(isResetGraphics ? args.concat(['--', '--reset-graphics']) : args),
			};
			if (chosenLanguage) {
				override['locale'] = chosenLanguage;
			}
			return engine.start(override);
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
