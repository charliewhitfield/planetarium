; Assistant probe suites -- measuring instruments for asset and photometry work,
; driven over the ivoyager_assistant TCP server by Python in the private assets
; build tree. Each script's class doc says what it measures and why it is here.
;
; Kept separate from ivoyager_override.cfg because a driver may rewrite this file
; to add or remove a suite for the length of one run, then put it back -- which is
; what addons/tools/capture_body_icons.py does with body_2d_icon_suite.gd.

[assistant_test_suites]

ProbeExposureSuite="res://planetarium/probe_exposure_suite.gd"
DialogRigProbeSuite="res://planetarium/dialog_rig_probe_suite.gd"
